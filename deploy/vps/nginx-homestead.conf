# HOMESTEAD SERVICES — dedicated site only. Does not replace other VPS applications.
# Preview:  http://164.68.99.83:8094/
# Public:   http://homestead.164.68.99.83.nip.io/

upstream homestead_next {
    server 127.0.0.1:3091;
    keepalive 16;
}

server {
    listen 8094;
    listen [::]:8094;
    server_name _;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Site "Homestead-Services" always;

    location / {
        proxy_pass http://homestead_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name homestead.164.68.99.83.nip.io;
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://homestead_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }
}
