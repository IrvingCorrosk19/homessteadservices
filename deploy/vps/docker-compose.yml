services:
  homestead_web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homestead.lat}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-servicios@homestead.lat}
        NEXT_PUBLIC_HOURS: "${NEXT_PUBLIC_HOURS:-8:00 a.m. a 10:00 p.m.}"
        NEXT_PUBLIC_SERVICE_AREA: "${NEXT_PUBLIC_SERVICE_AREA:-Todo Panamá}"
    container_name: homestead_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3091:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homestead.lat}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-servicios@homestead.lat}
      NEXT_PUBLIC_HOURS: "${NEXT_PUBLIC_HOURS:-8:00 a.m. a 10:00 p.m.}"
      NEXT_PUBLIC_SERVICE_AREA: "${NEXT_PUBLIC_SERVICE_AREA:-Todo Panamá}"
      CONTACT_INBOX: ${CONTACT_INBOX:-servicios@homestead.lat}
      SMTP_HOST: ${SMTP_HOST:-mail.privateemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-servicios@homestead.lat}
      SMTP_PASS: ${SMTP_PASS:-}
      DATA_DIR: /app/data
      N8N_HOMESTEAD_WEBHOOK_URL: ${N8N_HOMESTEAD_WEBHOOK_URL:-}
      N8N_HOMESTEAD_WEBHOOK_SECRET: ${N8N_HOMESTEAD_WEBHOOK_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    volumes:
      - /opt/apps/homestead/data:/app/data
