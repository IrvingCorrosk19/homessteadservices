services:
  homestead_web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homestead.lat}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-servicios@homestead.lat}
        NEXT_PUBLIC_HOURS: "${NEXT_PUBLIC_HOURS:-8:00 a.m. a 10:00 p.m.}"
        NEXT_PUBLIC_SERVICE_AREA: "${NEXT_PUBLIC_SERVICE_AREA:-Todo Panamá}"
    container_name: homestead_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3091:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homestead.lat}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-servicios@homestead.lat}
      NEXT_PUBLIC_HOURS: "${NEXT_PUBLIC_HOURS:-8:00 a.m. a 10:00 p.m.}"
      NEXT_PUBLIC_SERVICE_AREA: "${NEXT_PUBLIC_SERVICE_AREA:-Todo Panamá}"
      CONTACT_INBOX: ${CONTACT_INBOX:-servicios@homestead.lat}
      SMTP_HOST: ${SMTP_HOST:-mail.privateemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-servicios@homestead.lat}
      SMTP_PASS: ${SMTP_PASS:-}
      DATA_DIR: /app/data
      N8N_HOMESTEAD_WEBHOOK_URL: ${N8N_HOMESTEAD_WEBHOOK_URL:-}
      N8N_HOMESTEAD_WEBHOOK_SECRET: ${N8N_HOMESTEAD_WEBHOOK_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      HOMESTEAD_TELEGRAM_CHAT_ID: ${HOMESTEAD_TELEGRAM_CHAT_ID:-}
      HOMESTEAD_TELEGRAM_ADMIN_CHAT_IDS: ${HOMESTEAD_TELEGRAM_ADMIN_CHAT_IDS:-}
      CONTENT_STUDIO_ENABLED: ${CONTENT_STUDIO_ENABLED:-true}
      CONTENT_MODE: ${CONTENT_MODE:-ASSISTED}
      CONTENT_DRY_RUN: ${CONTENT_DRY_RUN:-true}
      CONTENT_TIMEZONE: ${CONTENT_TIMEZONE:-America/Panama}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      MARKETING_INTELLIGENCE_SHADOW: ${MARKETING_INTELLIGENCE_SHADOW:-true}
      MARKETING_INTELLIGENCE_DRY_RUN: ${MARKETING_INTELLIGENCE_DRY_RUN:-true}
      AI_CONCIERGE_ENABLED: ${AI_CONCIERGE_ENABLED:-true}
      AI_CONCIERGE_DRY_RUN: ${AI_CONCIERGE_DRY_RUN:-true}
      AI_CONCIERGE_CREATE_LEADS: ${AI_CONCIERGE_CREATE_LEADS:-true}
      HOT_LEAD_ATTENTION_MINUTES: ${HOT_LEAD_ATTENTION_MINUTES:-30}
      APPOINTMENT_REMINDER_ENABLED: ${APPOINTMENT_REMINDER_ENABLED:-true}
      APPOINTMENT_REMINDER_OFFSETS: ${APPOINTMENT_REMINDER_OFFSETS:-24h,2h}
      HOMESTEAD_TIMEZONE: ${HOMESTEAD_TIMEZONE:-}
      REVENUE_ENGINE_ENABLED: ${REVENUE_ENGINE_ENABLED:-true}
      REVENUE_ENGINE_DRY_RUN: ${REVENUE_ENGINE_DRY_RUN:-true}
      AUTO_FOLLOW_UP: ${AUTO_FOLLOW_UP:-false}
      REVENUE_BRIEFING_SEND: ${REVENUE_BRIEFING_SEND:-false}
    volumes:
      - /opt/apps/homestead/data:/app/data
