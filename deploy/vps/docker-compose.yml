services:
  homestead_web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://164.68.99.83:8094}
    container_name: homestead_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3091:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://164.68.99.83:8094}
